<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>NASA APOD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --card-bg: #f4f4f4;
            --accent: #0b3d91;
        }

        body.dark {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --accent: #3b82f6;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: 0.3s ease;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-weight: 600;
            color: var(--accent);
        }

        .toggle-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: var(--accent);
            color: white;
            font-weight: 500;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: 0.3s ease;
        }

        img {
            width: 100%;
            border-radius: 12px;
            margin-top: 1rem;
        }

        .date {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .explanation {
            margin-top: 1.5rem;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>🚀 NASA Astronomy Picture of the Day</h1>
            <button class="toggle-btn" onclick="toggleMode()">🌙 Dark Mode</button>
        </header>

        <div class="card">
            <h2>{{ data['title'] }}</h2>
            <div class="date">📅 {{ data['date'] }}</div>

            {% if data['media_type'] == 'image' %}
            <img src="{{ data['url'] }}" alt="NASA APOD Image">
            {% else %}
            <iframe src="{{ data['url'] }}" width="100%" height="500px"></iframe>
            {% endif %}

            <div class="explanation">
                <h3>📝 Explanation</h3>
                <p>{{ data['explanation'] }}</p>
            </div>
        </div>

        <footer>
            Data provided by NASA Open API
        </footer>

    </div>

    <script>
        function toggleMode() {
            document.body.classList.toggle("dark");

            const btn = document.querySelector(".toggle-btn");

            if (document.body.classList.contains("dark")) {
                btn.textContent = "☀️ Light Mode";
            } else {
                btn.textContent = "🌙 Dark Mode";
            }
        }
    </script>

</body>

</html>
