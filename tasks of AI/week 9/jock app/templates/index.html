<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Laugh</title>
    <!-- Modern Styling via Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; height: 100vh; }
        .joke-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .setup { font-weight: bold; font-size: 1.2rem; color: #333; }
        .punchline { font-style: italic; color: #007bff; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h1 class="mb-4">Random Joke Generator</h1>
            
            <div class="card joke-card p-4">
                <div class="card-body">
                    {% if joke %}
                        <p class="setup">"{{ joke.setup }}"</p>
                        <p class="punchline">— {{ joke.punchline }}</p>
                    {% elif error %}
                        <p class="text-danger">{{ error }}</p>
                    {% else %}
                        <p class="text-muted">Need a laugh? Press the button below!</p>
                    {% endif %}

                    <form method="POST" class="mt-4">
                        <button type="submit" class="btn btn-primary btn-lg w-100">Get a Random Joke</button>
                    </form>
                </div>
            </div>
            
            <p class="mt-4 text-secondary" style="font-size: 0.8rem;">
                Lab 9- Programming for AI
            </p>
        </div>
    </div>
</div>

</body>
</html>
