<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Expert QnA Bot</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; text-align: center; padding: 50px; }
        .chat-container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input[type="text"] { width: 80%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 10px; }
        input[type="submit"] { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .response-box { margin-top: 30px; text-align: left; padding: 15px; background: #f8f9fa; border-left: 5px solid #007bff; }
        .bot-label { font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>🛡️ Security Expert Bot</h2>
    <p>Ask me about phishing, spam, or online safety.</p>
    
    <form action="/ask" method="POST">
        <input type="text" name="user_query" placeholder="e.g. How to spot a fake email?" required>
        <input type="submit" value="Ask Bot">
    </form>

    {% if answer %}
    <div class="response-box">
        <p><strong>You asked:</strong> {{ question }}</p>
        <p><span class="bot-label">Bot Answer:</span> {{ answer }}</p>
        <small style="color: gray;">(Matched with: {{ matched }})</small>
    </div>
    {% endif %}
</div>

</body>
</html>
