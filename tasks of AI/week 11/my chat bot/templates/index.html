<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Serenity AI - Mental Health Bot</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .chat-container { max-width: 500px; margin: 50px auto; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .chat-header { background: #6c5ce7; color: white; padding: 20px; text-align: center; }
        #chat-box { height: 400px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { margin-bottom: 15px; padding: 10px 15px; border-radius: 18px; max-width: 80%; }
        .user-msg { align-self: flex-end; background: #6c5ce7; color: white; }
        .bot-msg { align-self: flex-start; background: #e9ecef; color: #333; }
        .input-area { display: flex; padding: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header"><h3>Serenity AI</h3><p class="mb-0">How can I help you today?</p></div>
    <div id="chat-box">
        <div class="msg bot-msg">Hello! I'm Serenity. I'm here to listen to anything on your mind.</div>
    </div>
    <form id="chat-form" class="input-area">
        <input type="text" id="user-input" class="form-control" placeholder="Type a message..." required>
        <button type="submit" class="btn btn-primary ms-2">Send</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        $("#chat-form").on("submit", function(e) {
            e.preventDefault();
            let userText = $("#user-input").val();
            $("#chat-box").append(`<div class="msg user-msg">${userText}</div>`);
            $("#user-input").val("");
            
            $.post("/get", { msg: userText }, function(data) {
                setTimeout(() => {
                    $("#chat-box").append(`<div class="msg bot-msg">${data.response}</div>`);
                    $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                }, 500);
            });
        });
    });
</script>
</body>
</html>
